        app: contoso-kendo-grid-api
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: CONTOSO_API_SERVICEACCOUNT_NAME
      containers:
      - name: contoso-kendo-grid-api
        image: ACR_NAME.azurecr.io/contosokendogridapi:latest
        ports:
        - containerPort: 8080
        env:
        - name: baseBslUrl
          value: "http://contoso-kendo-grid-bsl:8080/"
        - name: keyVaultUrl
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: keyVaultUrl
        - name: bslCertificateName
          value: "frontend-client-cert"
        - name: AllowedOrigins__0
          value: "*"
        envFrom:
        - configMapRef:
            name: app-config
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /weatherforecast
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /weatherforecast
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: contoso-kendo-grid-api
  namespace: contoso-apps
spec:
  type: ClusterIP
  selector:
    app: contoso-kendo-grid-api
  ports:
