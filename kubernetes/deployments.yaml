      - name: contoso-kendo-grid-bsl
        image: ACR_NAME.azurecr.io/contosokendogridbsl:latest
        ports:
        - containerPort: 8080
        env:
        - name: ConnectionStrings__DefaultConnection
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: db-connection-string
        - name: ExpectedCerificateThumbprint
          value: "EXPECTED_CERTIFICATE_THUMBPRINT"
        envFrom:
        - configMapRef:
            name: app-config
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /weatherforecast
            port: 8080
          initialDelaySeconds: 30
